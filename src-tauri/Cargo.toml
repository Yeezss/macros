[package]
name = "clickr"
version = "1.0.0"
description = "clickr - high performance macro clicker"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# embeds the ui into the exe (what `tauri build` enables)
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
